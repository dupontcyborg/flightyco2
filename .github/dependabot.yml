version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      dev-dependencies:
        dependency-type: "development"
      prod-minor-patch:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # TS 7 dropped the plugin API that Astro/Svelte tooling depends on:
      # @astrojs/check and svelte2tsx both still peer-cap at typescript ^6.
      # Remove once @astrojs/check widens its typescript peer range.
      - dependency-name: "typescript"
        update-types:
          - "version-update:semver-major"
